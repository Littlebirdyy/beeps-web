:root { --paper:#F5F4ED; --ink:#171E19; --soft:#5A645D; --line:#E3E1D5; --pine:#2C6A4A; --honey:#E0A32E; --cream:#FDF3DC; }
* { box-sizing:border-box; margin:0; }
body { background:var(--paper); font-family:"Be Vietnam Pro",sans-serif; color:var(--ink); }
.app { max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:90px; }
button { font-family:inherit; cursor:pointer; border:none; }
.bird { width:32px; height:32px; }
.mast { padding:16px 18px 2px; display:flex; align-items:center; gap:10px; }
.mast .bird { width:30px; height:30px; flex:none; }
.mast .wm { font-weight:800; font-size:19px; letter-spacing:-0.3px; }
.mast .wm span { color:var(--honey); font-weight:800; }
.head { padding:10px 18px 8px; }
.head .hi { font-weight:800; font-size:18px; }
.head .sub { font-size:12px; color:var(--pine); font-weight:600; margin-top:2px; }
.body { padding:6px 16px; }
.brandfoot { display:flex; align-items:center; gap:11px; margin:22px 2px 4px; padding-top:16px; border-top:1.5px solid var(--line); }
.brandfoot .bird { width:28px; height:28px; flex:none; }
.brandfoot .ft { font-weight:800; color:var(--pine); font-size:13.5px; }
.brandfoot .fs { font-size:10.5px; color:var(--soft); margin-top:2px; line-height:1.4; }
.menubtn { display:block; margin:20px 0 0; text-align:center; font-weight:800; font-size:15.5px; text-decoration:none; border-radius:14px; padding:15px; color:#3a2a00; background:var(--honey); box-shadow:0 10px 20px -8px rgba(224,163,46,.7); }
.ctline { margin-top:11px; text-align:center; font-size:12.5px; color:var(--soft); line-height:1.6; } .ctline b { color:var(--pine); font-weight:800; }
.lo { text-align:center; margin-top:12px; }
.lo a { font-size:11.5px; color:var(--soft); text-decoration:underline; cursor:pointer; }
.card { background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 10px 30px -18px rgba(23,30,25,.25); }
.imgw { position:relative; aspect-ratio:1/1; }
.imgw img { width:100%; height:100%; object-fit:cover; display:block; }
.imgw .lbl { position:absolute; left:0; right:0; bottom:0; padding:36px 16px 12px; color:#fff; font-weight:800; font-size:19px; background:linear-gradient(transparent, rgba(23,30,25,.85)); }
.imgw .st { position:absolute; top:12px; left:12px; background:var(--honey); color:#231a05; font-weight:800; font-size:11.5px; padding:6px 12px; border-radius:999px; }
.in { padding:14px 16px 16px; }
.rowx { display:flex; align-items:center; gap:10px; }
.badge { margin-left:auto; background:var(--cream); border:1.5px solid var(--honey); color:#7A5A00; font-weight:800; font-size:12.5px; padding:6px 12px; border-radius:999px; white-space:nowrap; }
.kem { font-size:13px; color:var(--soft); line-height:1.55; margin:8px 0 12px; }
.kem b { color:var(--ink); }
.stats { display:flex; gap:7px; }
.stat { flex:1; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:8px 2px; text-align:center; }
.stat.kc { border:2px solid var(--pine); }
.stat .v { font-weight:800; font-size:15.5px; color:var(--pine); }
.stat .k { font-size:9.5px; color:var(--soft); font-weight:600; margin-top:1px; }
.chip { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12px; color:#33413A; font-weight:600; margin:4px 4px 0 0; }
.fb { margin-top:14px; background:var(--cream); border:1px solid var(--honey); border-radius:16px; padding:12px 14px; }
.fb .q { font-weight:700; font-size:13.5px; color:#7A5A00; margin-bottom:9px; }
.fb .opts { display:flex; gap:8px; }
.fb .opts button { flex:1; background:#fff; border:1px solid var(--line); border-radius:11px; padding:9px 0; font-size:13px; font-weight:700; }
.fb .opts button.sel { background:var(--pine); color:#fff; border-color:var(--pine); }
.fb .send { margin-top:11px; width:100%; background:var(--pine); color:#fff; font-weight:800; border-radius:11px; padding:11px; font-size:13.5px; display:none; }
.fb .send.on { display:block; }
.fb .send:disabled { opacity:.6; }
.fb .fbl { font-size:11px; font-weight:800; color:#7A5A00; letter-spacing:.3px; text-transform:uppercase; margin:10px 0 5px; }
.fb .opts.ngon button { font-size:11px; padding:8px 1px; }
.fb .fbgopy { width:100%; margin-top:10px; border:1px solid var(--line); border-radius:11px; padding:9px 11px; font-family:inherit; font-size:13px; resize:vertical; min-height:42px; background:#fff; color:var(--ink); }
.fb .fbgopy:focus { outline:none; border-color:var(--pine); }
.fb .fbok { font-size:13px; font-weight:700; color:var(--pine); text-align:center; margin-top:9px; }
.fb.done { background:#EAF4EE; border-color:var(--pine); text-align:center; }
.fb.done .q { color:var(--pine); margin-bottom:4px; }
.fb .fbdone { font-size:12.5px; color:var(--soft); line-height:1.5; }
.sect { font-weight:800; font-size:15px; margin:18px 0 10px; }
.eyebrow { font-size:10.5px; font-weight:800; letter-spacing:1.4px; color:var(--honey); text-transform:uppercase; margin-bottom:3px; }
.acc { background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:10px; overflow:hidden; }
.acc[open] { border:2px solid var(--pine); }
.acc summary { display:flex; align-items:center; gap:12px; padding:10px; cursor:pointer; list-style:none; }
.acc summary::-webkit-details-marker { display:none; }
.acc summary img { width:56px; height:56px; border-radius:12px; object-fit:cover; flex:none; }
.acc .sm-txt { min-width:0; }
.acc .sm-txt .t { font-weight:700; font-size:14px; }
.acc .sm-txt .s { font-size:11.5px; color:var(--soft); margin-top:2px; }
.acc .sm-r { margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }
.acc .sm-r .kc { font-weight:800; color:var(--pine); font-size:13px; white-space:nowrap; }
.acc .chev { color:var(--pine); font-size:12px; transition:transform .2s; }
.acc[open] .chev { transform:rotate(180deg); }
.acc .todaytag { background:var(--honey); color:#231a05; font-weight:800; font-size:9.5px; padding:2px 8px; border-radius:999px; margin-left:6px; }
.accbody { padding:4px 14px 14px; border-top:1px solid var(--line); }
.line { display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; align-items:baseline; }
.line:last-of-type { border-bottom:none; }
.line .ic { flex:none; width:20px; }
.line .lt { color:var(--soft); }
.line b { color:var(--pine); }
.ministats { display:flex; gap:6px; margin-top:12px; }
.kcard { display:flex; gap:12px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 8px 22px -18px rgba(23,30,25,.25); }
.kcard .kic { font-size:26px; flex:none; line-height:1.2; }
.kcard .kt { font-weight:800; font-size:14.5px; margin-bottom:4px; }
.kcard .kd { font-size:12.5px; color:var(--soft); line-height:1.5; }
.kcard .kb { font-size:12.5px; color:var(--pine); font-weight:700; margin-top:8px; background:var(--cream); border-radius:9px; padding:6px 10px; }
.prow { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 15px; display:flex; margin-bottom:8px; font-size:13.5px; gap:12px; }
.prow .k { color:var(--soft); font-weight:600; flex:none; }
.prow .v { margin-left:auto; font-weight:700; text-align:right; }
.tabs { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px 12px; }
.tab { flex:1; background:none; text-align:center; font-size:10.5px; color:var(--soft); font-weight:700; }
.tab .i { font-size:20px; display:block; margin-bottom:2px; filter:grayscale(1); opacity:.55; }
.tab.on { color:var(--pine); }
.tab.on .i { filter:none; opacity:1; }
.note { font-size:10.5px; color:#9AA39B; text-align:center; padding:12px 20px 0; line-height:1.5; }
.gate { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
.gate .bird { width:72px; height:72px; }
.gate .herofood { width:100%; max-width:340px; height:230px; object-fit:cover; object-position:center; border-radius:18px; box-shadow:0 16px 36px -22px rgba(23,30,25,.5); margin-bottom:6px; }
.trans { background:var(--cream); border:1px solid var(--honey); border-radius:16px; padding:18px; text-align:center; margin-bottom:14px; }
.trans .tt { font-weight:800; font-size:15px; color:var(--pine); line-height:1.4; }
.trans .tb { font-size:13.5px; color:var(--ink); margin:9px 0 14px; line-height:1.5; } .trans .tb b { color:var(--pine); }
.trans .tzalo { display:inline-block; background:var(--honey); color:#3a2a00; font-weight:800; font-size:14px; padding:12px 18px; border-radius:12px; text-decoration:none; }
.gate .lk2 { font-weight:800; font-size:22px; margin-top:8px; }
.gate .lk2 span { color:var(--honey); }
.gate h2 { font-size:21px; font-weight:800; margin:16px 0 8px; }
.gate p { color:var(--soft); font-size:14px; max-width:300px; line-height:1.6; }
.gate input { width:100%; max-width:290px; padding:14px 16px; border:2px solid var(--line); border-radius:14px; font-size:16px; font-family:inherit; text-align:center; margin-top:18px; background:#fff; color:var(--ink); }
.gate input:focus { outline:none; border-color:var(--pine); }
.gate .gbtn { width:100%; max-width:290px; margin-top:10px; background:var(--pine); color:#fff; font-weight:800; padding:14px; border-radius:14px; font-size:15px; }
.gate .gbtn:disabled { opacity:.6; }

function knowCards(){

function fbKeyToday(){ return "beeps_fb_"+todayInfo().iso; }
function fbDone(){ try{ return !!localStorage.getItem(fbKeyToday()); }catch(e){ return false; } }
function fbBlock(P, m){
  if(fbDone()) return '<div class="fb done"><div class="q">✅ Đã gửi đánh giá hôm nay</div><div class="fbdone">Cảm ơn '+esc(P.ten)+'! Beeps đã nhận — hẹn bạn bữa sau nha 💛</div></div>';
  return '<div class="fb"><div class="q">🍽️ '+esc(m.D.ten)+' — bạn thấy sao?</div>'+
    '<div class="fbl">Độ ngon</div><div class="opts ngon">'+
    ['😕 Dở','🙂 Được','😋 Ngon','🤤 Rất ngon'].map(function(o){return '<button type="button" onclick="pickNgon(this,\''+o+'\')">'+o+'</button>';}).join("")+'</div>'+
    '<div class="fbl">Khẩu phần (giúp Beeps chỉnh cỡ)</div><div class="opts no">'+
    ['😫 Đói','😊 Vừa','🥱 No quá'].map(function(o){return '<button type="button" onclick="pickNo(this,\''+o+'\')">'+o+'</button>';}).join("")+'</div>'+
    '<textarea id="fbgopy" class="fbgopy" placeholder="Góp ý cho Beeps (không bắt buộc)…"></textarea>'+
    '<button class="send on" id="fbsend" onclick="submitFb()">Gửi đánh giá cho Beeps 🐦</button>'+
    '<div id="fbok" class="fbok"></div></div>';
}
function mealCard(P, di, label){
  const m = computeMeal(P, di);
  const kem = m.D.damTxt+" <b>"+m.damG+"g</b> · "+m.carbTen+" <b>"+m.grams+"g</b> · "+m.D.rauTxt+" <b>"+m.rauG+"g</b>"+(P.rauF>1?" <b>×1.5</b>":"")+" · trứng cắt tư <b>"+P.q+" miếng</b>";
  const chips = P.notes.map(n=>'<span class="chip">📌 '+esc(n)+'</span>').join("");
  return '<div class="card"><div class="imgw"><img src="'+IMGS[m.D.imgKey]+'"><div class="st">'+label+'</div><div class="lbl">'+m.D.ten+'</div></div>'+
    '<div class="in"><div class="rowx"><div style="font-weight:800;font-size:16px;">Hộp của '+esc(P.ten)+'</div><div class="badge">'+P.size+'</div></div>'+
    '<div class="kem">'+kem+'</div>'+
    '<div class="stats"><div class="stat kc"><div class="v">'+m.kcal+'</div><div class="k">kcal</div></div>'+
    '<div class="stat"><div class="v">'+m.p+'g</div><div class="k">Đạm</div></div><div class="stat"><div class="v">'+m.c+'g</div><div class="k">T.bột</div></div>'+
    '<div class="stat"><div class="v">'+m.f+'g</div><div class="k">Béo</div></div><div class="stat"><div class="v">'+m.x+'g</div><div class="k">Xơ</div></div></div>'+
    '<div>'+chips+'<span class="chip">🚚 '+esc(P.noi)+' · '+P.gio+'</span></div>'+
    fbBlock(P, m)+'</div></div>';
}

function custView(P){
  const t = todayInfo();
  const now = new Date();
  const hello = now.getHours()<11 ? "Chào buổi sáng" : (now.getHours()<14 ? "Trưa rồi" : "Chào");
  let html = '<div class="app">'+masthead()+'<div class="head"><div class="hi">'+hello+', '+esc(P.ten)+' 🐦</div><div class="sub">Beeps đã soạn hộp theo đúng hồ sơ của bạn</div></div><div class="body">';
  if (CUR_TAB==="home") {
    if (t.done) {
      html += transMsg(P);
    } else {
      html += mealCard(P, t.di, t.label);
      html += '<div class="note">Số dinh dưỡng là ước tính tham khảo, tính riêng theo hồ sơ của bạn. Muốn nghỉ/đổi bữa: nhắn Beeps trước 9h sáng.</div>';
    }
    if (IS_OWNER) html += '<button class="ownbtn" onclick="SHOW_ADMIN=true; route();">👩‍🍳 Xem lệnh sản xuất cho mẹ →</button>';
  } else if (CUR_TAB==="menu") {
    html += '<div class="eyebrow">Thực đơn ăn thử</div><div class="sect">📅 3 ngày Beeps soạn cho '+esc(P.ten)+'</div>';
    DAYS.forEach((D,di)=>{
      const m = computeMeal(P,di);
      const isToday = di===t.di;
      const lines =
        '<div class="line"><span class="ic">🍗</span><span><span class="lt">Đạm · </span>'+esc(m.D.damTxt)+' <b>'+m.damG+'g</b></span></div>'+
        '<div class="line"><span class="ic">🍚</span><span><span class="lt">Tinh bột · </span>'+m.carbTen+' <b>'+m.grams+'g</b></span></div>'+

function adminView(){
  const D = DAYS[ADM_DAY];
  let trang=0, lut=0, quart=0, rauTot=0, damTot=0;
  let rows = "";
  PEOPLE.forEach(P=>{
    const m = computeMeal(P, ADM_DAY);
    if (m.gaoKey==="lut") lut += m.grams; else trang += m.grams;
    quart += P.q; rauTot += m.rauG; damTot += m.damG;
    rows += '<tr><td><b>'+esc(P.ten)+'</b><br><span style="font-size:10px;color:var(--soft)">'+(P.real?'':'~')+P.kg+'kg</span></td><td><b style="color:var(--pine)">'+m.damG+'g</b></td><td>'+m.grams+'g '+(m.gaoKey==="lut"?"lứt":"trắng")+'</td><td>'+m.rauG+'g</td><td><b>'+P.q+'</b></td><td style="font-size:10.5px">'+esc(P.notes.join(" · ")||"—")+'</td></tr>';
  });
  return '<div class="app">'+masthead()+'<div class="head"><div class="hi">👩‍🍳 Lệnh sản xuất</div><div class="sub">'+PEOPLE.length+' hộp/ngày · đạm theo cân nặng</div></div><div class="body">'+
    (IS_OWNER?'<button class="ownbtn back" onclick="SHOW_ADMIN=false; CUR_TAB=\''+'home'+'\'; route();">← Về thẻ của tôi</button>':'')+
    '<div class="dayspicker">'+DAYS.map((d,i)=>'<button class="'+(i===ADM_DAY?'on':'')+'" onclick="ADM_DAY='+i+'; route();">Ngày '+(i+1)+'<br>'+d.ten+'</button>').join("")+'</div>'+
    '<div class="warn">⚠️ '+esc(D.warn)+' · Trang Kao giáp xác — 3 món đều AN TOÀN.</div>'+
    '<div class="abox"><b>A. TỔNG NẤU:</b><br>'+esc(D.prodDam)+': <b>'+damTot+'g chín</b> (~'+(damTot*1.4/1000).toFixed(1)+'kg sống)<br>'+
    'Gạo trắng: <b>'+trang+'g</b> · Gạo lứt: <b>'+lut+'g</b> · '+esc(D.prodRau)+': <b>'+(rauTot>=1000?(rauTot/1000).toFixed(2)+'kg':rauTot+'g')+'</b> · Trứng: <b>'+Math.ceil(quart/4)+' quả</b> (cắt tư = '+quart+' miếng)</div>'+
    '<div class="sect">B. CHIA HỘP</div><table class="atbl"><tr><th>Tên</th><th>Đạm</th><th>Cơm</th><th>Rau</th><th>Trứng¼</th><th>Ghi chú</th></tr>'+rows+'</table>'+
    '<div class="note">Đạm = thịt/cá CHÍN theo cân nặng (chia từ mẻ chung). Trứng cắt tư bù đạm 1–4 miếng/hộp. Cơm = gạo SỐNG. KHÔNG canh.</div>'+
    foot()+'</div></div>';
}

function pickNgon(btn, v){ btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); FB_NGON=v; }
function pickNo(btn, v){ btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("sel")); btn.classList.add("sel"); FB_SEL=v; }
function submitFb(){
  if(!CURP) return;
  if(!FB_NGON && !FB_SEL){ const ok=document.getElementById("fbok"); if(ok){ok.textContent="Chọn giúp Beeps độ ngon hoặc khẩu phần nha 🙏"; ok.style.color="#C15B5B";} return; }
  const t = todayInfo();
  const gopy = (document.getElementById("fbgopy")||{}).value || "";
  const data = {"form-name":"beeps-feedback", khach:CURP.ten, ngay:"Ngày "+(t.di+1), mon:DAYS[t.di].ten, ngon:FB_NGON||"", khau_phan:FB_SEL||"", gopy:gopy};
  const body = Object.keys(data).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(data[k]);}).join("&");
  const btn=document.getElementById("fbsend"); if(btn){btn.disabled=true; btn.textContent="Đang gửi…";}
  function done(){ try{ localStorage.setItem(fbKeyToday(), "1"); }catch(e){} FB_NGON=null; FB_SEL=null; route(); }
  fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).then(done).catch(done);
}

function route(){
  const root = document.getElementById("root");
  if (IS_ADMIN || (IS_OWNER && SHOW_ADMIN)) root.innerHTML = adminView();
  else if (CURP) root.innerHTML = custView(CURP);
  else root.innerHTML = gateView();
}
function logout(){ try{ localStorage.removeItem("beeps_phone"); }catch(e){} CURP=null; IS_ADMIN=false; IS_OWNER=false; SHOW_ADMIN=false; CUR_TAB="home"; route(); }
function doLoginKey(e){ if(e.key==="Enter") doLogin(); }

const ITER = 100000;
const te = new TextEncoder(), td = new TextDecoder();
function b64d(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function deriveKey(phone, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(phone), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function tryDecrypt(blob, phone){
  try{ const key=await deriveKey(phone, b64d(blob.s)); const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(blob.iv)}, key, b64d(blob.ct)); return JSON.parse(td.decode(pt)); }catch(e){ return null; }
}
async function attempt(raw){
  const phone = phoneNorm(raw);
  if(!phone) return false;
  for(const blob of BLOBS){ const obj = await tryDecrypt(blob, phone); if(obj){
    if(obj.role==="admin"){ PEOPLE=obj.people; IS_ADMIN=true; CURP=null; }
    else if(obj.role==="owner"){ PEOPLE=obj.people; CURP=obj; IS_OWNER=true; IS_ADMIN=false; SHOW_ADMIN=false; }
    else { CURP=obj; IS_ADMIN=false; IS_OWNER=false; }
    CUR_TAB="home"; try{ localStorage.setItem("beeps_phone", raw); }catch(e){}
    return true;
  } }
  return false;
}
async function doLogin(){
  const inp=document.getElementById("ph"), err=document.getElementById("gerr"), btn=document.getElementById("gbtn");
  const v=(inp.value||"").trim(); if(!v) return;
  btn.disabled=true; btn.textContent="Đang mở…"; err.style.display="none";
  const ok = await attempt(v);
  if(ok){ route(); } else { btn.disabled=false; btn.textContent="Xem suất của tôi"; err.style.display="block"; }
}
